[project]
name = "ccrcc-semantic-preprocessing"
version = "0.1.0"
description = "Semantic-guided multimodal preprocessing for ViT-based CCRCC grading"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "accelerate>=0.26.0",
    "datasets>=4.4.1",
    "matplotlib>=3.10.7",
    "mlflow>=3.6.0",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "pillow>=11.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.14",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccrcc_grading"]

[tool.ruff]
line-length = 88
